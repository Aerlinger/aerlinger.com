<form class="search" role="search" onsubmit="return false">
  <label class="visually-hidden" for="search-input">Search posts</label>
  {% include icon.html name="search" %}
  <input id="search-input" type="search" placeholder="Search posts…" autocomplete="off" autofocus
         data-index="{{ '/search.json' | relative_url }}">
</form>
<ul class="post-list" id="search-results" aria-live="polite"></ul>
<noscript><p>Search needs JavaScript. You can also <a href="{{ '/tags/' | relative_url }}">browse by tag</a>.</p></noscript>
