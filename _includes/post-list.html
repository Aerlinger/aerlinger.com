<ul class="post-list">
  {%- for post in include.posts %}
  <li>
    <a class="post-link" href="{{ post.url | relative_url }}">
      <span class="post-link-title">{{ post.title | escape }}</span>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    </a>
  </li>
  {%- endfor %}
</ul>
