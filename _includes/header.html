<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">{{ site.title | slice: 0 | upcase }}</span>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/#writing' | relative_url }}">Writing</a>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/search/' | relative_url }}" class="icon-link" aria-label="Search"{% if page.url == '/search/' %} aria-current="page"{% endif %}>{% include icon.html name="search" %}</a>
      <button type="button" class="theme-toggle icon-link" aria-label="Toggle dark mode">
        {% include icon.html name="sun" %}{% include icon.html name="moon" %}
      </button>
    </nav>
  </div>
</header>
